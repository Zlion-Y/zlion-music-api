# /etc/nginx/conf.d/zlion-music-api.conf
#
# 两种写法按需选一种：
#   A. 常规 443 + 域名（推荐）
#   B. 非标端口 446 监听 IPv6（你的场景）
#
# 共同要点：前端（https://www.zlion.top）是 HTTPS，浏览器禁止 HTTPS 页面请求
# http:// 资源（Mixed Content）——所以对外的这一层**必须是 https**，
# 不能直接把 http://[ipv6]:446 填进主页配置。

# ── A. 443 + 域名 ──────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name music-api.zlion.top;

    ssl_certificate     /etc/letsencrypt/live/music-api.zlion.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music-api.zlion.top/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 关键：Origin / Referer 原样透传，否则白名单会被误判
        proxy_set_header Origin  $http_origin;
        proxy_set_header Referer $http_referer;
        proxy_read_timeout 60s;
    }

    # 管理页：别公开，只放行自己的 IP（令牌之外再加一道门）
    location /admin {
        allow 127.0.0.1;
        # allow 2001:db8::/32;   # 你的管理侧 IPv6 段
        deny all;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }
}

# ── B. 446 端口 + IPv6 ─────────────────────────────────────
# 域名 AAAA 指向你的 IPv6，证书签给域名（证书里带 IP SAN 也可以，但更麻烦）
server {
    listen [::]:446 ssl;
    listen 0.0.0.0:446 ssl;     # 想同时接 IPv4 就留着这行
    http2 on;
    server_name music-api.zlion.top;

    ssl_certificate     /etc/letsencrypt/live/music-api.zlion.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music-api.zlion.top/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin  $http_origin;
        proxy_set_header Referer $http_referer;
    }
}
